name: Deploy mock to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config package
        run: pnpm --filter @ember/config build

      - name: Build domain package
        run: pnpm --filter @ember/domain build

      - name: Build mock for GitHub Pages
        working-directory: apps/web
        env:
          VITE_MOCK: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          pnpm exec tsc -p tsconfig.json
          pnpm exec vite build --mode mock.production
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
