<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ember - Declarar presença</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: '#f4efe7',
              'surface-variant': '#fbf8f3',
              primary: '#aa4f36',
              'primary-container': '#fcebea',
              'on-primary-container': '#aa4f36',
              'on-surface': '#20211f',
              'on-surface-variant': '#5a5b58',
              'outline-variant': '#d1cdc6',
            },
            borderRadius: {
              "DEFAULT": "1rem",
              "lg": "2rem",
              "xl": "3rem",
              "full": "9999px"
            },
            fontFamily: {
              "headline": ["EB Garamond", "serif"],
              "display": ["EB Garamond", "serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
          },
        },
      }
    </script>
<style>
        /* Add some specific orbital decoration styles */
        .orbital-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(170, 79, 54, 0.1);
            pointer-events: none;
            z-index: 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen relative overflow-x-hidden pb-32">
<!-- Orbital Decorations -->
<div class="orbital-circle w-[600px] h-[600px] -top-[150px] -right-[300px]"></div>
<div class="orbital-circle w-[800px] h-[800px] -bottom-[200px] -left-[400px]"></div>
<!-- TopAppBar Component (from JSON) -->
<header class="fixed top-6 left-1/2 -translate-x-1/2 w-[90%] max-w-2xl rounded-full bg-surface/80 backdrop-blur-md dark:bg-surface/80 shadow-md border border-outline-variant/20 flex justify-between items-center px-6 py-3 z-50">
<button aria-label="Voltar" class="text-primary dark:text-primary hover:bg-surface-variant/50 transition-colors duration-300 rounded-full p-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings_backup_restore</span>
</button>
<span class="font-headline text-2xl font-bold tracking-tight text-primary dark:text-primary">Ember</span>
<button class="text-primary dark:text-primary font-body text-body-md hover:bg-surface-variant/50 transition-colors duration-300 rounded-full px-3 py-1 font-medium">EN</button>
</header>
<main class="relative z-10 pt-32 px-6 max-w-[390px] mx-auto md:max-w-xl">
<!-- Header Section -->
<div class="mb-10 text-center">
<span class="inline-block px-3 py-1 rounded-full border border-primary text-primary bg-primary-container font-label text-xs font-semibold tracking-wider uppercase mb-6">
                Rodada Aberta
            </span>
<h1 class="font-headline text-4xl md:text-5xl font-bold mb-4 text-on-surface">Declarar presença</h1>
<p class="font-body text-on-surface-variant text-base leading-relaxed">
                Escolha os horários em que você pode participar desta rodada.
            </p>
</div>
<!-- Availability Section -->
<section class="bg-surface-variant rounded-xl p-6 shadow-sm border border-outline-variant/30 mb-6">
<h2 class="font-label text-sm font-semibold text-on-surface-variant mb-4 uppercase tracking-wide">Horários disponíveis</h2>
<div class="flex flex-wrap gap-3">
<button class="px-5 py-2.5 rounded-full border-2 border-primary bg-primary-container text-primary font-medium text-sm transition-all">
                    Segunda à noite
                </button>
<button class="px-5 py-2.5 rounded-full border border-outline-variant text-on-surface bg-transparent hover:bg-surface transition-all font-medium text-sm">
                    Quarta à noite
                </button>
<button class="px-5 py-2.5 rounded-full border-2 border-primary bg-primary-container text-primary font-medium text-sm transition-all">
                    Sábado de manhã
                </button>
</div>
</section>
<!-- Intention Section -->
<section class="bg-surface-variant rounded-xl p-6 shadow-sm border border-outline-variant/30 mb-12">
<h2 class="font-label text-sm font-semibold text-on-surface-variant mb-4 uppercase tracking-wide">Intenção para esta rodada</h2>
<div class="space-y-3">
<label class="flex items-start p-4 rounded-lg border border-outline-variant hover:border-primary/50 cursor-pointer transition-colors bg-surface/50">
<input class="mt-1 h-4 w-4 text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface-variant" name="intention" type="radio"/>
<div class="ml-4 flex-1">
<span class="block font-medium text-on-surface text-base mb-1">Surpresa</span>
<span class="block text-on-surface-variant text-sm">aberto ao inesperado</span>
</div>
</label>
<label class="flex items-start p-4 rounded-lg border-2 border-primary bg-primary-container/20 cursor-pointer transition-colors">
<input checked="" class="mt-1 h-4 w-4 text-primary border-primary focus:ring-primary focus:ring-offset-surface-variant" name="intention" type="radio"/>
<div class="ml-4 flex-1">
<span class="block font-medium text-primary text-base mb-1">Fronteira</span>
<span class="block text-primary/80 text-sm">quero sair da zona de conforto</span>
</div>
</label>
<label class="flex items-start p-4 rounded-lg border border-outline-variant hover:border-primary/50 cursor-pointer transition-colors bg-surface/50">
<input class="mt-1 h-4 w-4 text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface-variant" name="intention" type="radio"/>
<div class="ml-4 flex-1">
<span class="block font-medium text-on-surface text-base mb-1">Facilidade</span>
<span class="block text-on-surface-variant text-sm">prefiro leveza neste encontro</span>
</div>
</label>
</div>
</section>
<!-- Primary CTA -->
<button class="w-full bg-[#20211f] text-surface py-4 rounded-full font-medium text-lg hover:opacity-90 transition-opacity shadow-md flex items-center justify-center gap-2">
            Confirmar presença
            <span class="material-symbols-outlined text-xl">check_circle</span>
</button>
</main>
<!-- Footer Component (from JSON - Suppressed on mobile per instructions, but included for complete responsive structure if needed later, hidden by default on mobile) -->
<footer class="hidden md:flex flex-col md:flex-row justify-between items-center px-8 max-w-7xl mx-auto gap-6 w-full py-12 mt-auto bg-surface dark:bg-surface border-t border-outline-variant/30">
<span class="font-headline text-lg italic text-primary">Ember</span>
<nav class="flex gap-6">
<a class="font-body text-label-md text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">Rituals</a>
<a class="font-body text-label-md text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">Gatherings</a>
<a class="font-body text-label-md text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">Journal</a>
<a class="font-body text-label-md text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100" href="#">About</a>
</nav>
<span class="font-body text-label-md text-primary dark:text-primary">© 2024 Ember. Cultivating Presence.</span>
</footer>
</body></html>
