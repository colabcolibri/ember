<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ember - Verificar código</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:wght@100..900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: '#f4efe7',
                        surface: '#fbf8f3',
                        'surface-variant': '#e0dad0',
                        primary: '#aa4f36',
                        'primary-container': '#f0d8ce',
                        'on-primary-container': '#38160e',
                        outline: '#8c8273',
                        'outline-variant': '#d6cfc2',
                        'on-surface': '#201a18',
                        'on-surface-variant': '#53433e',
                        accent: '#7b9070' // sage
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.75rem", // 28px
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["EB Garamond", "serif"],
                        display: ["EB Garamond", "serif"],
                        body: ["Inter", "sans-serif"],
                        label: ["Inter", "sans-serif"],
                        mono: ["Space Mono", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f4efe7;
        }
        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .otp-input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen relative overflow-hidden flex flex-col items-center justify-center pt-24 pb-8 px-4 sm:px-6">
<!-- Decorative Elements -->
<div class="absolute top-[-10%] right-[-10%] w-[300px] h-[300px] rounded-full border border-primary/20 pointer-events-none"></div>
<div class="absolute top-[15%] right-[5%] w-2 h-2 rounded-full bg-primary/40 pointer-events-none"></div>
<div class="absolute top-[5%] right-[15%] w-3 h-3 rounded-full bg-accent/40 pointer-events-none"></div>
<!-- Shared Component: TopAppBar -->
<nav class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between shadow-sm border border-outline-variant/30 bg-surface/90 dark:bg-surface/90 backdrop-blur-md rounded-full mt-6 mx-auto w-fit px-6 py-2">
<div class="flex items-center gap-2 text-primary font-headline text-display-sm italic">
<span class="material-symbols-outlined font-headline text-2xl italic tracking-tight text-primary dark:text-primary">lens_blur</span>
<span class="font-headline text-2xl italic tracking-tight text-primary dark:text-primary font-bold">Ember</span>
</div>
<div class="ml-6 text-on-surface-variant font-body text-sm font-medium hover:text-primary transition-colors cursor-pointer scale-95 active:scale-90 transition-transform">
            PT / EN
        </div>
</nav>
<!-- Main Content Canvas -->
<main class="w-full max-w-[390px] w-full z-10 flex flex-col gap-8">
<!-- Hero Section -->
<header class="text-center px-2">
<h1 class="font-headline text-4xl text-on-surface mb-3 tracking-tight">Verificar código</h1>
<p class="font-body text-on-surface-variant text-base leading-relaxed">
                Enviamos um código para <br/><span class="font-medium text-on-surface">voce@exemplo.com</span>
</p>
</header>
<!-- Main Card -->
<section class="bg-surface rounded-lg p-[30px] shadow-sm border border-outline-variant/30 flex flex-col gap-8">
<div class="flex flex-col gap-2">
<label class="sr-only" for="otp-input">Código de 6 dígitos</label>
<div class="relative w-full">
<input autocomplete="one-time-code" class="otp-input w-full bg-transparent border-b-2 border-outline-variant focus:border-primary text-center font-mono text-3xl tracking-[0.35em] text-on-surface placeholder:text-outline-variant/50 focus:outline-none focus:ring-0 py-4 transition-colors" id="otp-input" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="000000" type="text"/>
</div>
<p class="text-center text-xs text-on-surface-variant/70 font-body mt-2">
                    Não recebeu? <button class="text-primary hover:underline font-medium focus:outline-none">Reenviar</button>
</p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-2">
<button class="w-full bg-primary text-surface font-body font-medium py-4 px-6 rounded-full hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface transition-all active:scale-[0.98] shadow-sm flex justify-center items-center gap-2">
                    Entrar
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<button class="w-full bg-transparent text-on-surface-variant font-body font-medium py-3.5 px-6 rounded-full border border-outline-variant hover:border-primary hover:text-primary focus:outline-none focus:ring-2 focus:ring-outline focus:ring-offset-2 focus:ring-offset-surface transition-all active:scale-[0.98]">
                    Usar outro email
                </button>
</div>
</section>
</main>
<script>
        // Simple script to format OTP input visually if needed, though native input handles the basics well enough here due to pattern and type.
        document.addEventListener('DOMContentLoaded', () => {
            const otpInput = document.getElementById('otp-input');
            otpInput.addEventListener('input', function(e) {
                // Ensure only numbers are kept
                this.value = this.value.replace(/[^0-9]/g, '');
            });
        });
    </script>
</body></html>
